[build]
  command = "git ls-files --error-unmatch package-lock.json && git diff --exit-code -- package-lock.json && npm ci --include=dev --no-audit --no-fund && npm run verify && npm run build:netlify"
  publish = "dist/netlify"

[build.environment]
  NODE_VERSION = "22.16.0"
  NPM_FLAGS = "--include=dev --no-audit --no-fund"
